# Lance les tests de l'application à chaque push et à chaque pull request.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:      # bouton « Run workflow » dans l'onglet Actions

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Installer les dépendances
        run: python -m pip install -r requirements-app.txt

      - name: Lancer les tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker (mode démo)
        run: docker build -t lightshift-app .
      - name: Vérifier que l'API répond
        run: |
          docker run -d -p 8000:8000 --name app lightshift-app
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
